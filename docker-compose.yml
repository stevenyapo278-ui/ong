version: '3.8'

services:
  # ─── Base de données PostgreSQL ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ong_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ong_db
      POSTGRES_USER: ong_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ong_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ong_user -d ong_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ong_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://ong_user:${POSTGRES_PASSWORD:-ong_password}@postgres:5432/ong_db?schema=public
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SITE_URL: ${SITE_URL:-https://ongbienvivre.ci}
      FRONTEND_URL: ${FRONTEND_URL:-https://ongbienvivre.ci}
      GENIUSPAY_BASE_URL: ${GENIUSPAY_BASE_URL}
      GENIUSPAY_API_KEY: ${GENIUSPAY_API_KEY}
      GENIUSPAY_API_SECRET: ${GENIUSPAY_API_SECRET}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ong_network

  # ─── Frontend React/Nginx ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: ong_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - ong_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ong-frontend.rule=Host(`${DOMAIN:-ongbienvivreici.org}`)"
      - "traefik.http.routers.ong-frontend.entrypoints=websecure"
      - "traefik.http.routers.ong-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.ong-frontend.loadbalancer.server.port=80"

networks:
  ong_network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
